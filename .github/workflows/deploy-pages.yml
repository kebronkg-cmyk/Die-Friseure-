name: GitHub Pages auf die echte Adresse umleiten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Die Website liegt bei STRATO (siehe strato.yml). Die Kopie hier
      # leitet nur noch weiter, damit alte Links ankommen und Google keine
      # zweite Fassung findet.
      - name: Weiterleitungen bauen
        run: |
          mkdir _site
          for seite in index preise impressum datenschutz; do
            ziel="https://die-friseure-haidhausen.de/$seite.html"
            if [ "$seite" = index ]; then ziel="https://die-friseure-haidhausen.de/"; fi
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="de"><head><meta charset="utf-8">' \
              '<title>Die Friseure</title>' \
              '<meta name="robots" content="noindex">' \
              "<link rel=\"canonical\" href=\"$ziel\">" \
              "<meta http-equiv=\"refresh\" content=\"0; url=$ziel\">" \
              "<script>location.replace(\"$ziel\" + location.search + location.hash);</script>" \
              "</head><body><p><a href=\"$ziel\">Weiter zu Die Friseure</a></p></body></html>" \
              > "_site/$seite.html"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
